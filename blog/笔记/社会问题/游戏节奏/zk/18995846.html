电视剧«入戏»的两位主演李淑元和奥利（刘天跃）有一群CP粉，CP名为“天定良元”，CP粉会到处找两人的爱情佐证。<br>
李淑元的网名叫“法尔伽”，据说是因为喜欢«原神»里的法尔伽。<br>
CP粉找到奥利的一张黄头发的照片，说他长得像法尔伽，说李淑元找到了他的“法尔伽”。<br>
CP粉开始抢占“法尔伽”相关tag，引发法尔伽角色厨不满。<br>
“天定良元”粉头呼吁：停止使用“法尔伽”tag。
