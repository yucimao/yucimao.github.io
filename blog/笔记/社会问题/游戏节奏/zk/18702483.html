function renderTable(arr){
    let html='<table>';
    //表头
    let thRow=arr[0];
    html+='<tr style="position:sticky;top:0;background:#eee;font-weight:bold">';
    for(let item of thRow){
        html+=`<th>${item}</th>`
    }
    html+='</tr>';

    //数据行 从第1条开始
    for(let i=1;i<arr.length;i++){
        let row=arr[i];
        //第一列编号做a标签
        let firstTd=`<td>${i}</td><td><a href="https://space.bilibili.com/${row[0]}">${row[0]}</a></td>`;
        //剩下单元格
        let otherTds='';
        for(let j=1;j<row.length;j++){
            otherTds+=`<td>${row[j]}</td>`
        }
        html+=`<tr>${firstTd}${otherTds}</tr>`
    }
    html+='</table>';
    document.getElementById('dy').innerHTML=html;
}
