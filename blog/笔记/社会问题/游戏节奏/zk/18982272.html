一个抖音网友发帖说要建“米游党”，要发布“党旗”、发行“米哈游中央银行货币”。<br>
个人判断是米黑搞抽象，他发的“米游党1号文件”是一份“游戏鄙视链”，列出的“最高阶-婆罗门”是«迷你世界枪战精英»和«原神»；其他内容也都是些网上的抽象文案，比如「我的愚蠢犯的错，清华大学填成了暨南大学，我该死，我该死」、「看见室友在玩网上很火的千恋万花，就想着跟室友搞好关系肯定要有共同话题，就鼓起勇气去要了直装包」。
