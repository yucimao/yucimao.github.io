function dy地图(o,b){
  document.getElementById("当前位置").innerHTML="当前位置："+地图[o][0];
    let dy="";

    let 临时=[];

      if(地图[o][i][0]=="t"){//文字 ["t","文字","name"]
        临时[0]="e";
        临时[1]=地图[o][i][1];
        if(地图[o][i][1]){临时[4]=地图[o][i][1]}

        临时[0]="bus";
        临时[1]=地图[o][i][1];
        临时[2]="前往："+地图[o][i][2].split("_")[0];
        临时[3]="跳转('"+地图[o][i][2]+"')";
      }else if(地图[o][i][0]=="前往"||地图[o][i][0]=="返回"){//更新地图 ["前往","目标_x","显示文字"]
        临时[0]="bus";
        临时[1]=地图[o][i][1];
        if(地图[o][i][3]){
          临时[2]=地图[o][i][0]+"："+地图[o][i][3].split("_")[0];
          临时[3]="dy地图('"+地图[o][i][2]+"','"+地图[o][i][3]+"')";
        }else{
          临时[2]=地图[o][i][0]+"："+地图[o][i][2].split("_")[0];
          临时[3]="dy地图('"+地图[o][i][2]+"')";
        }
      }else if(地图[o][i][0]=="dw"){//小网页
        临时[0]="绿";
        临时[1]=地图[o][i][1];
        临时[3]=`dw(dwb='${地图[o][i][3]}',dwd='${地图[o][i][2]}')`;
      }else{
        //颜色,文字,词条,name,提示
        if(!地图[o][i][2]){地图[o][i][2]=地图[o][i][1]}
        临时[0]=地图[o][i][0];
        临时[1]=地图[o][i][1].split("_")[0];
        if(地图[o][i][3]){临时[4]=地图[o][i][3]}
        if(地图[o][i][4]){临时[2]=地图[o][i][4]}
        临时[3]="弹窗('"+地图[o][i][2].replace(/<[^>]*>/g,'')+"')";
      }
    }else if(地图[o][i]==0){//街道
      临时[0]="a";
    }else if(地图[o][i]==1){//纯空
      临时[0]="e";
    }else{
      临时[0]="b";
      if(地图[o][i].indexOf("／")!=-1){
        临时[1]=地图[o][i].split("／")[0];
        临时[2]=地图[o][i].split("／")[1];
      }else{
        临时[1]=地图[o][i];
      }
    }
      //0 <div class='【】'>
      //1 <div>【】
      //2 data-msg=【】
      //3 onclick=【】
      //4 name
      dy+=`<div class='${临时[0]}${(临时[2])?" 提示":""}'${(临时[2]?" data-msg='"+临时[2]+"'":"")}${(临时[3])?` onclick="${临时[3]}"`:""}${(临时[4])?" name='"+临时[4]+"'":""}>${(临时[1])?临时[1]:""}</div>`;
  }
  document.getElementById("mapWrap").innerHTML=dy;
  if(b){跳转(b)}else{跳转('top')}
}

  鼠标.style.top=e.clientY+'px';

  if(e.clientX>lastX){
    鼠标.classList.add('flip');
  }else if(e.clientX<lastX){
    鼠标.classList.remove('flip');
  }
  lastX=e.clientX;

  clearTimeout(idleTimer);
  if(!isAnimating){
    isAnimating=true;
    toggleFrame();
    animTimer=setInterval(toggleFrame,FRAME_DELAY);
  }

  idleTimer=setTimeout(()=>{
    isAnimating=false;
    clearInterval(animTimer);
    animTimer=null;
    setStatic();
  }, IDLE_DELAY);
});

setStatic();
</script>
