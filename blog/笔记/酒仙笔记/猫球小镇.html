const 鼠标=document.getElementById('鼠标');
let isAnimating=false;
let frameToggle=false;
let animTimer=null;
let idleTimer=null;
const FRAME_DELAY=220;//动画
const IDLE_DELAY=400;//静止
let lastX=0;

function setStatic(){
  鼠标.style.backgroundImage=`url(${图src}鼠标1.png)`;
}
function toggleFrame(){
  鼠标.style.backgroundImage=frameToggle 
    ? `url(${图src}鼠标2.png)` 
    :`url(${图src}鼠标3.png)`;
  frameToggle=!frameToggle;
}

document.addEventListener('mousemove',(e)=>{
  鼠标.style.left=e.clientX+'px';
  鼠标.style.top=e.clientY+'px';

  if(e.clientX>lastX){
    鼠标.classList.add('flip');
  }else if(e.clientX<lastX){
    鼠标.classList.remove('flip');
  }
  lastX=e.clientX;

  clearTimeout(idleTimer);
  if(!isAnimating){
    isAnimating=true;
    toggleFrame();
    animTimer=setInterval(toggleFrame,FRAME_DELAY);
  }

  idleTimer=setTimeout(()=>{
    isAnimating=false;
    clearInterval(animTimer);
    animTimer=null;
    setStatic();
  }, IDLE_DELAY);
});
