  鼠标.style.top=e.clientY+'px';

  if(e.clientX>lastX){
    鼠标.classList.add('flip');
  }else if(e.clientX<lastX){
    鼠标.classList.remove('flip');
  }
  lastX=e.clientX;

  clearTimeout(idleTimer);
  if(!isAnimating){
    isAnimating=true;
    toggleFrame();
    animTimer=setInterval(toggleFrame,FRAME_DELAY);
  }

  idleTimer=setTimeout(()=>{
    isAnimating=false;
    clearInterval(animTimer);
    animTimer=null;
    setStatic();
  }, IDLE_DELAY);
});
