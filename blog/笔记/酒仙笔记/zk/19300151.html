<style>.红{color:#ff0000;}</style>
<ol li>
    <li>未成年<span class="红">禁止</span>饮酒。</li>
    <li><span class="红">禁止</span>喝咖啡。</li>
    <li><span class="红">禁止</span>吸烟。</li>
    <li><span class="红">禁止</span>未经允许触碰他人的帽子。</li>
    <li><del>阿哈、</del>悲悼伶人<span class="红">禁止</span>进入。</li>
    <li>可以带宠物，但<span class="红">不可以</span>影响到别人。</li>
    <li>请确认猫球只有一个，若你看到两个或更多，可以尝试停止饮酒，并找到离你最近的猫球，对他说「<span class="红">我想变清醒</span>」。</li>
</ol>
