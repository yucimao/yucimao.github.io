<h5>ROKITA WODKA CZYSTA</h5><br>
应该是游戏里出现的唯一一瓶酒。<br>
“Rokita”是波兰民间传说中的恶魔，住在合布（Chyb）山上，和一群土匪为伍。他虽然抢劫富商，但会把赃物分给村民，所以传说里把他描述成一个“慷慨的恶棍”。<br>
“Wodka”是“伏特加”的波兰语。<br>
“Czysta”在波兰语里是“清洁的、干净的”。
