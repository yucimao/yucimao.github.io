皮渣杂饮
巨魔：「够劲！像一拳打在鼻子上！余味缠人，三天都散不掉。」

皮渣浊酒
哥布林：「这味道！我得告诉整个部落！沼泽味！这是哥布林的五星级味道！这后味能持续三天？赚到了！」

毒液悬浮酒
吸血鬼：「完美。这杯酒值三倍价格，入口就是一阵腐甜…有点上头，黏稠的沼泽感铺满了整个舌面，余味缠人，三天都散不掉。」

胶质悬浮酒
吸血鬼：「入口就是一阵腐甜…有点上头，余韵如永恒般甜腐…绝妙。」
