<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图片反色处理</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:#f2f5f9;padding:20px}
.upload-view{
    height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:20px;
}
.upload-btn{
    padding:16px 36px;
    background:#407bff;
    color:#fff;
    border:none;
    border-radius:10px;
    font-size:18px;
    cursor:pointer;
}
.upload-btn:hover{background:#2d68e8}
#file{display:none}
.image-view{
    display:none;
    text-align:center;
    padding-top:30px;
}
.target-img{
    transform: scaleX(-1) scaleY(-1);
    filter: invert(1);
    max-width:95%;
    max-height:85vh;
}
canvas{display:none}
</style>
</head>
<body>
<div class="upload-view" id="uploadBox">
    <label class="upload-btn">
        选择图片
        <input type="file" id="file" accept="image/*">
    </label>
</div>

<div class="image-view" id="imageBox">
    <img id="imgEle" class="target-img">
</div>

<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const uploadBox = document.getElementById('uploadBox');
const imageBox = document.getElementById('imageBox');
const imgEle = document.getElementById('imgEle');
const fileInput = document.getElementById('file');

const query = location.search;
if(query.length > 1){
    const imgUrl = decodeURIComponent(query.slice(1));
    uploadBox.style.display = 'none';
    imageBox.style.display = 'block';
    imgEle.src = imgUrl;
}else{
    uploadBox.style.display = 'flex';
    imageBox.style.display = 'none';
    fileInput.onchange = e=>{
        const file = e.target.files[0];
        if(!file)return;
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = ev=>{
            const tempImg = new Image();
            tempImg.src = ev.target.result;
            tempImg.onload = ()=>drawDownload(tempImg);
            fileInput.value = '';
        }
    }
}

function drawDownload(img){
    const w = img.width;
    const h = img.height;
    canvas.width = w;
    canvas.height = h;
    ctx.translate(w,h);
    ctx.scale(-1,-1);
    ctx.drawImage(img,0,0);
    const imgData = ctx.getImageData(0,0,w,h);
    const data = imgData.data;
    for(let i=0;i<data.length;i+=4){
        data[i] = 255 - data[i];
        data[i+1] = 255 - data[i+1];
        data[i+2] = 255 - data[i+2];
    }
    ctx.putImageData(imgData,0,0);
    const a = document.createElement('a');
    a.download = '图片.jpg';
    a.href = canvas.toDataURL('image/jpeg',0.9);
    a.click();
}
</script>
</body>
</html>
